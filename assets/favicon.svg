<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
    <!-- Smooth, professional dark slate circular backdrop for universal tab contrast -->
    <circle cx="64" cy="64" r="60" fill="#0F172A" />
    
    <!-- Minimalist inner accent ring for an elegant, polished touch -->
    <circle cx="64" cy="64" r="54" fill="none" stroke="#334155" stroke-width="2" />
    
    <!-- Elegant Cursive Typography: Balanced for high micro-scale legibility -->
    <text x="60" y="82" 
          font-family="'Lucida Handwriting', 'Apple Chancery', 'Brush Script MT', 'Segoe Script', cursive" 
          font-size="56" 
          font-style="italic"
          fill="#F8FAFC" 
          text-anchor="middle">HK</text>
</svg>
